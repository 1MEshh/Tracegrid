[package]
name = "tracegrid"
version = "0.1.0"
edition = "2021"
description = "High-performance Paris-Traceroute flow-consistent multipath probe engine, RFC 3550 jitter telemetry, BGP ASN path divergence analyzer, and dark-mode SVG topology generator."
license = "MIT OR Apache-2.0"
authors = ["1MEshh <152591660+1MEshh@users.noreply.github.com>"]
repository = "https://github.com/1MEshh/Tracegrid"
readme = "README.md"

[lib]
name = "tracegrid"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
